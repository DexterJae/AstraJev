# Task and pipeline configuration.

task:
  # PickToBasket: "the robot is spawned in close proximity to the shelf", so the
  # task is solvable arm-only. We additionally pin the base action dims to zero
  # (see astraxjev/types.py) to guarantee no mobile manipulation.
  env_id: PickToBasketContNiveaEnv
  scene_dir: demo_envs/test_unseen_items_pick_to_basket
  robot_uids: ds_fetch_basket
  control_mode: pd_joint_pos
  num_traj: 30
  start_seed: 0
  max_horizon: 500
  freeze_base: true
  freeze_head: true

geometry:
  # Standoff distance along the shelf normal for the pre-grasp pose.
  standoff_m: 0.18
  # Jev's coarse step, as a multiple of the current phase's own tolerance,
  # clamped. At scale 4 that is 16 cm in APPROACH, 10 cm in RETRACT and 24 cm
  # in PLACE -- always far above the 6 mm fine tolerance, so coarse control
  # cannot masquerade as fine control. This is the hybrid's main cost knob;
  # scripts/sweep_pricing.py sweeps it alongside the baseline's cadence.
  coarse_step_scale: 4.0
  coarse_step_min_m: 0.05
  coarse_step_max_m: 0.30
  # Radius within which APPROACH is considered complete and ALIGN takes over.
  handoff_radius_m: 0.06
  retract_m: 0.30
  finger_length_m: 0.03
  # Both copied from `drop_to_basket` in the benchmark's reference solution:
  # release well above the basket rim, and raise the torso first or the pose
  # is outside the fixed-base arm's reach.
  basket_release_offset_m: [0.05, 0.0, 0.40]
  pre_place_lift_m: 0.30

astra_only:
  # Astra-Global is re-queried for target re-localisation every N decision
  # ticks; Astra-Local is queried every tick.
  global_every_n_ticks: 4
  # Waypoints per Astra-Local call (action chunk length).
  chunk_len: 1
  # Decision tick = one pipeline.infer() call. The executor consumes a
  # waypoint over multiple env steps.
  max_ticks: 120

astra_jev:
  # Jev handles phases whose tolerance is coarser than this.
  jev_precision_threshold_mm: 20.0
  # Hand control to Astra when Jev's "ready to grasp" noul probability exceeds
  # this. Below it, Jev keeps driving the cheap approach.
  handoff_prob: 0.75
  # Jev-as-Q: after Astra proposes an ALIGN waypoint, Jev scores it. Reject and
  # ask Astra again at most this many times -- the accept/reject gate is there
  # to stop wasted Astra calls, so it must itself be budgeted.
  max_align_resamples: 2
  align_accept_score: 0.5
  # Escalate one Astra call if Jev's neighbour-collision noul exceeds this
  # during RETRACT (success is void if a non-target item is displaced).
  retract_risk_escalate: 0.5
  max_ticks: 160

mock:
  # Noise injected into the mock backends, in metres. These control the
  # *success-rate* half of the comparison and are a simulation assumption;
  # the cost half does not depend on them.
  astra_global_sigma_m: 0.025
  astra_local_sigma_m: 0.004
  jev_choice_accuracy: 0.88
  jev_noul_noise: 0.08
  detector_sigma_m: 0.02
  seed: 0
