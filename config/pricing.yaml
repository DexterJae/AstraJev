# Unit prices for the cost comparison.
#
# Both models are real, hosted, callable APIs, so unlike the first version of
# this file these are published rates rather than guesses. Each still carries a
# `provenance` string that is copied verbatim into every results JSON.
#
# When the pipelines run with --backend api, these numbers are not even used
# for the dollar figure: both providers return their own usage/cost and the
# ledger records that as authoritative, keeping the locally computed figure
# alongside so a divergence is visible. They are still used for the
# vendor-independent GFLOPs figure, which remains an assumption because
# neither model's parameter count is published.

models:
  astra:
    params_b: 1000.0
    usd_per_mtok_in: 10.0
    usd_per_mtok_out: 50.0
    usd_per_mtok_cached_in: 1.0
    usd_per_call: 0.0
    provenance: >-
      PUBLISHED. OpenAI gpt-6-astra standard tier, read 2026-11: $10 per
      million input tokens, $50 per million output tokens, $1 per million
      cached input tokens, for prompts up to 272K input tokens. Batch and Flex
      halve these; Fast mode doubles them. Output costs 5x input, so the
      number of Astra *responses* dominates this pipeline's bill, not the
      number of images. params_b is a GUESS -- the parameter count is not
      published -- so treat the GFLOPs figure, unlike the dollar figure, as an
      assumption.

  jev:
    params_b: 2.0
    usd_per_mtok_in: 0.042
    usd_per_mtok_out: 0.0
    usd_per_mtok_cached_in: 0.042
    usd_per_call: 0.0
    provenance: >-
      PUBLISHED. TypeSafe jev-1.14, read 2026-11: $0.042 per million input
      tokens, output tokens free, consistent with the model generating no
      tokens and answering every question in one shared read of the state.
      Reachable at https://openrouter.ai/api/alpha/decisions (model
      typesafe/jev-1.14) or https://api.typesafe.ai/v1/systemone (waitlisted).
      params_b is a GUESS; the weights are closed.
